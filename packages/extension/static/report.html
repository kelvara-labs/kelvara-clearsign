<!doctype html>
<html lang="en" data-page="report"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SignGuard report</title>
<style>
:root{--bg:rgba(5,9,17,.8);--card:#111a29;--fg:#edf2fc;--muted:#97a6be;--line:rgba(174,193,229,.14);--accent:#80efd3;--block:#80efd3;--crit:#ff8f9a;--high:#ffc886;--med:#e2d296;--low:#80efd3;color-scheme:dark;font:14px/1.6 ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--fg)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent}
body{display:grid;place-items:center;padding:16px;overflow:auto}
html:not([data-level]) body{background:var(--bg)}
html[data-level] body:has(.mode-hold,.mode-info){background:var(--bg)}
.card{width:min(100%,600px);max-height:calc(100dvh - 32px);overflow:auto;padding:22px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow-wrap:anywhere;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.mode-notice{padding:14px 16px;max-height:none}
body:has(.mode-notice){padding:0;place-items:stretch}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-size:11px}
.level{font-weight:700;font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid currentColor;color:var(--accent)}
[data-level=L4] .level,[data-level=blocked] .level,[data-level=L3] .level{color:var(--crit)}[data-level=L2] .level{color:var(--high)}[data-level=L1] .level{color:var(--low)}
h1{font-size:20px;margin:12px 0 6px}.mode-notice h1{font-size:15px;margin:8px 0 4px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 6px}
p{margin:6px 0}.muted{color:var(--muted);font-size:13px}
.versus{display:grid;grid-template-columns:1fr 1fr;gap:12px}.versus>div{border:1px solid var(--line);border-radius:10px;padding:2px 12px 8px}
@media (max-width:480px){.versus{grid-template-columns:1fr}.card{padding:16px}}
ol,ul{margin:4px 0;padding-left:22px}li{margin:3px 0}
.risk{font-size:11px;font-weight:700;text-transform:uppercase}[data-risk=critical] .risk{color:var(--crit)}[data-risk=high] .risk{color:var(--high)}[data-risk=medium] .risk{color:var(--med)}[data-risk=low] .risk{color:var(--low)}
.claim{border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:6px 0}.claim summary{cursor:pointer}
.kind{font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;border:1px solid var(--line)}.kind-Unknown,.kind-Conditional{color:var(--high)}.kind-Fact{color:var(--accent)}
code{font:12px ui-monospace,monospace;word-break:break-all}
.claim-level{font-size:11px;font-weight:700;margin-left:6px;color:var(--muted)}.claim-text{margin-top:8px}.advice{border-left:3px solid var(--accent);padding-left:8px;font-size:14px}
.evidence{border-top:1px solid var(--line);padding:6px 0;font-size:13px}.evidence>summary{cursor:pointer}
.evidence dl{display:grid;grid-template-columns:minmax(90px,auto) 1fr;gap:2px 10px;margin:6px 0 4px 12px}.evidence dt{color:var(--muted)}.evidence dd{margin:0}
.evidence h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:8px 0 2px 12px}
.status{margin-top:14px;font-weight:600}
footer{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
button{min-height:44px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;font-weight:600;cursor:pointer;touch-action:none;user-select:none}
.block{background:var(--block);border-color:var(--block);color:#fff}
.sign{--progress:0;background:linear-gradient(90deg,color-mix(in srgb,var(--crit) 40%,transparent) calc(var(--progress)*100%),transparent 0)}
.sign[data-armed=false]{color:var(--muted);border-style:dashed}
.mode-notice footer{margin-top:6px}.mode-notice button{min-height:32px;padding:4px 12px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media (max-width:400px){footer button{flex:1 1 100%}}

.card{width:min(100%,660px);padding:26px;border-radius:20px;background:radial-gradient(ellipse at 100% 0,#80efd308,transparent 70%),var(--card);box-shadow:0 30px 100px #0008;border-color:#aebfe025}
header{padding-bottom:17px;border-bottom:1px solid var(--line)}
.brand{display:flex;gap:8px;align-items:center;font-size:11px;letter-spacing:.015em;text-transform:none;color:#c8d4e8;font-weight:650;white-space:nowrap}.brand img{width:24px;height:27px}
.level{font-size:11px;font-weight:650;padding:4px 10px;background:#ffffff04;border-color:#aebfe025;border-radius:7px;white-space:nowrap}
h1{font-size:24px;line-height:1.3;letter-spacing:-.7px;margin:22px 0 12px;font-weight:650}
.summary{color:#adbad0;font-size:13px;line-height:1.7;margin-bottom:20px}
h2{font-size:10px;letter-spacing:1px;font-weight:650;margin:23px 0 10px}
.versus{gap:10px}.versus>div{background:#ffffff03;padding:14px;border-radius:12px}.versus h2{margin:0 0 8px;letter-spacing:.7px;font-size:9px}.versus p{font-size:12px;line-height:1.65}.versus>div:last-child{background:#a99aff07;border-color:#a99aff30}.versus>div:last-child h2{color:#bbadff}
.caps{list-style:none;padding:0}.caps li{padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#ffffff02;font-size:12px;margin:7px 0}.risk{font-size:9px;border-radius:4px;margin-right:5px}
.claim{padding:12px 14px;border-radius:11px;background:#ffffff02;margin:8px 0}.claim summary{font-size:12px;line-height:1.7}.claim[open]{background:#ffffff04;border-color:#aebfe033}.claim-title{font-weight:550}.kind{font-size:9px;border-radius:4px;background:#ffffff04;margin-right:2px}.claim-text{font-size:12px;color:#bac7db}.advice{font-size:12px;border-left-width:2px;margin:12px 0;padding:2px 0 2px 10px;color:#d1e3e5}
.evidence{font-size:11px;margin-top:11px;padding-top:10px}.evidence>summary{color:var(--muted)}.evidence dd code{font-size:11px}.hashes{list-style:none;padding:0}.hashes li{padding:10px 12px;background:#0b1320;border:1px solid var(--line);border-radius:8px}.hashes code{color:#a7b8d1;font-size:11px}
.status{padding:11px 12px;border-radius:9px;background:#80efd307;border:1px solid #80efd319;color:#a2c7bf;font-size:11px;font-weight:450;line-height:1.65;margin-top:22px}
footer{gap:10px;margin-top:15px}footer button{flex:1;font-size:12px;border-radius:10px;min-height:44px}.block{color:#112322;font-weight:700;border:0;background:linear-gradient(115deg,#80efd3,#89c6f7 65%,#ab9aff)}.sign{border-color:#ff8f9a40;color:#edc4c9}.hint{font-size:10px}.mode-notice{padding:12px 16px;border-radius:12px}.mode-notice header{padding-bottom:5px;border:0}.mode-notice .brand img{width:17px;height:20px}.mode-notice .status{margin-top:5px;padding:0;background:none;border:0;font-size:10px}.mode-notice h1{font-size:14px;line-height:1.3;margin:5px 0}.mode-notice footer{margin-top:6px}.mode-notice footer button{flex:none;min-height:28px;padding:4px 12px;font-size:11px}.mode-notice .level{font-size:9px;padding:2px 6px}
@media(max-width:480px){.card{padding:18px;border-radius:14px}.mode-notice{padding:10px 14px}h1{font-size:21px}.versus{grid-template-columns:1fr}.brand{font-size:10px}}
</style></head><body><script type="module" src="ui.js"></script></body></html>
